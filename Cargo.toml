[workspace]
members = ["crates/llmup-core", "crates/llmup-cli", "crates/llmup-runtime", "crates/llmup-gui"]
resolver = "3"
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.11.4"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"