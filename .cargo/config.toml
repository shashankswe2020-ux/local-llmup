[alias]
native-dist = "run --locked -p llmup-cli --bin llmup-dist --"
catalog-freshness = "run --quiet --locked -p llmup-cli --bin llmup-catalog-freshness --"
catalog-bootstrap = "run --quiet --locked -p llmup-cli --bin llmup-catalog-bootstrap --"
catalog-refresh = "run --quiet --locked -p llmup-cli --bin llmup-catalog-refresh --"
native-performance = "run --quiet --locked --release -p llmup-cli --example native-performance --"
native-retirement = "run --quiet --locked -p llmup-cli --example retirement-check --"