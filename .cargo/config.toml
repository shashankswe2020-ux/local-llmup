[alias]
llmup = "run --quiet --locked -p llmup-cli --bin llmup --"
local-llmup = "run --quiet --locked -p llmup-cli --bin local-llmup --"
native-dist = "run --locked -p llmup-cli --bin llmup-dist --"
catalog-freshness = "run --quiet --locked -p llmup-cli --bin llmup-catalog-freshness --"
catalog-bootstrap = "run --quiet --locked -p llmup-cli --bin llmup-catalog-bootstrap --"
catalog-refresh = "run --quiet --locked -p llmup-cli --bin llmup-catalog-refresh --"
catalog-enrich = "run --quiet --locked -p llmup-cli --bin llmup-catalog-enrich --"
catalog-coverage = "run --quiet --locked -p llmup-cli --bin llmup-catalog-coverage --"
catalog-notice = "run --quiet --locked -p llmup-cli --bin llmup-catalog-notice --"
native-performance = "run --quiet --locked --release -p llmup-cli --example native-performance --"
native-retirement = "run --quiet --locked -p llmup-cli --example retirement-check --"
native-browser-smoke = "run --quiet --locked -p llmup-gui --example browser_smoke --"
state-parity = "test --locked -p llmup-cli --test state_parity"
workflow-parity = "test --locked -p llmup-cli --test workflow_parity"