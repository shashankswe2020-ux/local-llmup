[package]
name = "llmup-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "llmup-fit-parity"
path = "src/main.rs"

[[bin]]
name = "llmup-native"
path = "src/native.rs"

[[bin]]
name = "llmup-dist"
path = "src/dist.rs"

[[bin]]
name = "llmup-catalog-freshness"
path = "src/catalog_freshness.rs"

[[bin]]
name = "llmup-catalog-bootstrap"
path = "src/catalog_bootstrap.rs"

[[bin]]
name = "llmup-catalog-refresh"
path = "src/catalog_refresh.rs"

[[bin]]
name = "llmup-catalog-coverage"
path = "src/catalog_coverage.rs"

[[bin]]
name = "llmup-catalog-notice"
path = "src/catalog_notice.rs"

[[bin]]
name = "llmup-catalog-enrich"
path = "src/catalog_enrich.rs"

[dependencies]
llmup-core = { path = "../llmup-core" }
llmup-runtime = { path = "../llmup-runtime" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
unicode-normalization = "0.1"
regex = "1"
sha2 = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
portable-pty = "0.9"