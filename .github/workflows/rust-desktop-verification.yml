name: Rust Desktop Verification

on:
  workflow_dispatch:
  push:
    branches: [feature/rust-backend-migration, feature/rust-migration-follow-up]
    paths:
      - .github/workflows/rust-desktop-verification.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - apps/desktop/src-tauri/**
      - src/gui/static/**
      - tests/e2e-native/**
      - playwright.rust.config.ts
      - scripts/rust-dialog-smoke.*
      - vendor/**
      - .cargo/**

permissions:
  contents: read

concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 22.x
          cache: npm
      - name: Install Linux native WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 python3-pyatspi xdg-desktop-portal-gtk
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Native lint
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Native tests
        timeout-minutes: 15
        run: |
          cargo test --workspace --locked --no-fail-fast -- --nocapture
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Native build
        run: |
          cargo build --workspace --locked
          cargo build --locked -p llmup-cli --example dialog-smoke
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Real desktop WebView smoke
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LOCAL_LLMUP_HOME: ${{ runner.temp }}/llmup-r22
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            dbus-run-session -- xvfb-run -a apps/desktop/src-tauri/target/debug/llmup-desktop --smoke-test
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            apps/desktop/src-tauri/target/debug/llmup-desktop.exe --smoke-test
          else
            apps/desktop/src-tauri/target/debug/llmup-desktop --smoke-test
          fi
      - name: Install retained browser verification tooling
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Actual native folder dialogs
        if: runner.os != 'macOS'
        timeout-minutes: 3
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          XDG_CURRENT_DESKTOP: GNOME
          GTK_MODULES: gail:atk-bridge
          NO_AT_BRIDGE: "0"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a dbus-run-session -- target/debug/examples/dialog-smoke
          else
            target/debug/examples/dialog-smoke.exe
          fi
      - name: Native HTTP and browser journeys
        run: npm run rust:gui:e2e
      - name: Verification summary
        if: always()
        run: |
          printf '## R22: %s\n\nCommit: %s\n\nNative builds run before npm dependencies are installed. Consult each step result for native tests, real WebView and folder-dialog checks, and retained browser journeys. Signing and release publication are not performed.\n' "$RUNNER_OS" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
