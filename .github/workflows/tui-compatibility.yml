name: TUI Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-proof:
    name: Runtime proof (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [18.x, 20.x, 22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Enforce dependency policy
        run: npm run tui:dependency-policy

      - name: Generate production SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > tui-production-sbom.json

      - name: Type check
        run: npm run typecheck

      - name: Renderer proof
        run: npm run test:tui-proof

      - name: Build
        run: npm run build

      - name: Runtime budgets
        run: npm run tui:runtime-budget

  package-budget:
    name: Package budget (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Enforce package budgets
        run: npm run tui:package-budget

      - name: Production audit
        run: npm audit --omit=dev --audit-level=low
