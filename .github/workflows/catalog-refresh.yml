name: Catalog Refresh Dry Run

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-refresh:
    name: Incremental Catalog Refresh (dry-run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run incremental enrich dry-run
        run: npm run catalog:refresh:dry-run

      - name: Assert zero writes
        run: git diff --exit-code -- data/models.json