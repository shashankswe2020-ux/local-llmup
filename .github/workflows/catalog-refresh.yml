name: Catalog Freshness

on:
  schedule:
    # Every Monday 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Write the refreshed catalog to a dedicated branch and merge it through a
# reviewed PR — never a direct push to the protected default branch.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    name: Weekly catalog refresh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh catalog from the registry snapshot
        run: npm run catalog:refresh

      - name: Enrich catalog quant sizes + digests from the live registry
        run: npm run catalog:enrich

      - name: Audit upstream catalog coverage
        run: npm run --silent catalog:coverage

      - name: Catalog freshness report
        run: npm run --silent catalog:freshness

      - name: Detect catalog changes
        id: diff
        run: |
          if git diff --quiet -- data/models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the refreshed catalog
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm test

      - name: Open the catalog refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fresh branch per run (from current main) → a normal push, so the
          # branch-protection ruleset that blocks force-pushes is never tripped.
          BRANCH="catalog/auto-refresh-${GITHUB_RUN_ID}"
          TITLE="chore(catalog): weekly automated refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/models.json
          git commit -m "$TITLE"
          git push origin "$BRANCH"

          BODY=$(node -e "
            const r = require('./catalog-freshness.json');
            const lines = [
              'Automated weekly refresh of \`data/models.json\` — quant disk sizes and content digests refreshed from the live registry (curated fields untouched).',
              '',
              '- generated: ' + r.generatedAt,
              '',
              'Typecheck, lint, build, and the full test suite passed on this branch. Review the model changes before merging.',
              '',
              '_Opened automatically by the Catalog Freshness workflow._',
            ];
            process.stdout.write(lines.join('\n'));
          ")

          # Supersede any previous open auto-refresh PR so only the latest stands.
          for number in $(gh pr list --state open --search "$TITLE in:title" --json number --jq '.[].number'); do
            gh pr close "$number" --comment "Superseded by a newer automated refresh." --delete-branch || true
          done

          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"

      - name: Alert when the catalog is stale but in sync
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEEDS=$(node -e "process.stdout.write(String(require('./catalog-freshness.json').needsAttention))")
          if [ "$NEEDS" != "true" ]; then
            echo "Catalog is fresh and in sync — nothing to do."
            exit 0
          fi

          TITLE="Catalog freshness: refresh needed"
          BODY=$(node -e "
            const r = require('./catalog-freshness.json');
            const lines = [
              'The catalog is stale but the committed registry snapshot yields no drift — a maintainer needs to add newer entries to the snapshot.',
              '',
              '- generated: ' + r.generatedAt,
              '- age: ' + r.ageDays + ' day(s) (stale after ' + r.staleAfterDays + ')',
              '- status: ' + r.status,
              '',
              'Update \`src/catalog/registry-snapshot.ts\` with new pinned model entries; the next weekly run will open a refresh PR.',
              '',
              '_Filed automatically by the Catalog Freshness workflow._',
            ];
            process.stdout.write(lines.join('\n'));
          ")

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating a new freshness issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Reconcile upstream coverage issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Catalog coverage: upstream models missing"
          MISSING=$(node -e "process.stdout.write(String(require('./catalog-coverage.json').missing.length))")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          if [ "$MISSING" = "0" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "All models in the monitored Ollama local-library inventory are now represented in the curated catalog."
            fi
            echo "Catalog covers the monitored Ollama inventory."
            exit 0
          fi

          BODY=$(node -e "
            const r = require('./catalog-coverage.json');
            const lines = [
              'The curated catalog does not represent every repository in Ollama’s monitored local-model inventory.',
              '',
              '- upstream repositories: ' + r.upstreamCount,
              '- covered repositories: ' + r.coveredCount,
              '- missing repositories: ' + r.missing.length,
              '- source: ' + r.source,
              '',
              'Missing candidates:',
              '',
              ...r.missing.map(name => '- \\`' + name + '\\`'),
              '',
                'These are discovery candidates only. Verify license, architecture, context, capabilities, quantization, and source metadata before adding an entry to \\`src/catalog/registry-snapshot.ts\\`.',
                'This repository-level audit cannot detect missing variants inside a repository that is already represented because Ollama does not expose a public tag-enumeration endpoint.',
              '',
              '_Updated automatically by the Catalog Freshness workflow._',
            ];
            process.stdout.write(lines.join('\\n'));
          ")

          if [ -n "$EXISTING" ]; then
            echo "Updating existing coverage issue #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY"
          else
            echo "Creating a catalog coverage issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi
