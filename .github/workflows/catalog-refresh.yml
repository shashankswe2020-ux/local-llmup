name: Catalog Freshness

on:
  schedule:
    # Every Monday 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    name: Weekly catalog freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determinism guard (enrich makes no catalog writes)
        run: |
          npm run catalog:refresh:dry-run
          git diff --exit-code -- data/models.json

      - name: Catalog freshness report
        run: npm run --silent catalog:freshness

      - name: Open or update a freshness issue when attention is needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEEDS=$(node -e "process.stdout.write(String(require('./catalog-freshness.json').needsAttention))")
          if [ "$NEEDS" != "true" ]; then
            echo "Catalog is fresh and in sync — no issue needed."
            exit 0
          fi

          TITLE="Catalog freshness: refresh needed"
          BODY=$(node -e "
            const r = require('./catalog-freshness.json');
            const lines = [
              'The weekly catalog freshness check flagged \`data/models.json\` for review.',
              '',
              '- generated: ' + r.generatedAt,
              '- age: ' + r.ageDays + ' day(s) (stale after ' + r.staleAfterDays + ')',
              '- status: ' + r.status,
              '- drift: added=' + r.drift.added + ' updated=' + r.drift.updated + ' removed=' + r.drift.removed,
              '',
              'Reasons:',
              ...(r.reasons.length ? r.reasons.map(x => '- ' + x) : ['- (none)']),
              '',
              'Refresh the catalog (bootstrap/enrich pipeline) and open a PR updating \`data/models.json\`.',
              '',
              '_Filed automatically by the Catalog Freshness workflow._',
            ];
            process.stdout.write(lines.join('\n'));
          ")

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating a new freshness issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi
