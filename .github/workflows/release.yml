name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Enforce dependency policy
        run: npm run tui:dependency-policy

      - name: Production audit
        run: npm audit --omit=dev --audit-level=low

      - name: Generate production SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > tui-production-sbom.json

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Enforce package budgets
        run: npm run tui:package-budget

      - name: Pack verified artifact
        id: pack
        run: |
          npm pack --ignore-scripts --json > pack.json
          PACKAGE_FILE=$(node -e 'const [p]=require("./pack.json"); process.stdout.write(p.filename)')
          echo "package_file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify exact packed artifact
        run: npm publish "${{ steps.pack.outputs.package_file }}" --dry-run --ignore-scripts --json

      - name: Verify release identity
        run: npm run verify:release-identity -- "$GITHUB_REF_NAME" pack.json

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          # Use a delimiter to handle multiline output
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---

            📦 **npm:** [`local-llmup@${{ github.ref_name }}`](https://www.npmjs.com/package/local-llmup/v/${{ steps.changelog.outputs.version }})

            Install: `npm install -g local-llmup` or use `npx local-llmup`
          generate_release_notes: false
          files: |
            ${{ steps.pack.outputs.package_file }}
            tui-production-sbom.json
          fail_on_unmatched_files: true
