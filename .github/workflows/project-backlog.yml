name: Add items to backlog project

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add issue or PR to backlog project
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ vars.BACKLOG_PROJECT_URL != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Add to GitHub Project
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          PROJECT_URL: ${{ vars.BACKLOG_PROJECT_URL }}
          ITEM_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          pattern='^https://github\.com/(orgs|users)/([A-Za-z0-9-]+)/projects/([0-9]+)/?$'
          if [[ ! "$PROJECT_URL" =~ $pattern ]]; then
            echo "::error::BACKLOG_PROJECT_URL must be a GitHub project URL"
            exit 1
          fi
          gh project item-add "${BASH_REMATCH[3]}" --owner "${BASH_REMATCH[2]}" --url "$ITEM_URL"
